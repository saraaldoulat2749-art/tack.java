<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
     
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            margin: 0;
            padding: 50px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

    
        h1 {
            color: #fff;
          
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

  
        .input-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 400px;
            
        }

       
        #inputText {
           
            padding: 12px 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        #addButton {
            padding: 12px 20px;
            background-color: #00b894;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: background 0.3s ease;
        }

        #addButton:hover {
            background-color: #00cec9;
        }

      
        #listTask {
            width: 100%;
            max-width: 400px;
        }

        
        #listTask p {
            background-color: #fff;
            padding: 12px 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 10px;
            font-size: 16px;
            color: #2d3436;
            word-break: break-all;
        }

      
        #listTask button {
            background-color: #ff7675;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s ease;
        }

        #listTask button:hover {
            background-color: #d63031;
        }
    </style>
</head>
<body>

<h1>TO-DO-LIST</h1>

<input type="text" id="inputText" placeholder="please enter task name" >
<button id="addButton">Add Task</button>
<br><br>

<div id="listTask">

</div>

<script src="task.js"></script>
</body>
</html>
